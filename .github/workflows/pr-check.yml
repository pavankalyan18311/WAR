name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Fast-feedback check: lint + type check + unit tests only
  pr-check:
    name: PR Quick Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install aiosqlite ruff

      - name: Python lint
        working-directory: backend
        run: ruff check .

      - name: Backend unit tests
        working-directory: backend
        run: pytest tests/unit -m unit -v
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET_KEY: pr-check-secret-key
          JWT_ALGORITHM: HS256
          AWS_S3_BUCKET: test
          OPENAI_API_KEY: test

  # Ensure the PR doesn't contain secrets accidentally committed
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
