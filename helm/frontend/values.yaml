replicaCount: 2

image:
  repository: ghcr.io/threadx/threadx-frontend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: threadx.in
      paths:
        - path: /
          pathType: Prefix
    - host: www.threadx.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: threadx-frontend-tls
      hosts:
        - threadx.in
        - www.threadx.in

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

env:
  NEXT_PUBLIC_API_URL: "https://api.threadx.in/api"
  NODE_ENV: production

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
