version: "3.9"

services:
  # ─── PostgreSQL + pgvector ─────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: threadx_db
    environment:
      POSTGRES_DB: threadx_db
      POSTGRES_USER: threadx
      POSTGRES_PASSWORD: threadx_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadx -d threadx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: threadx_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── FastAPI Backend ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threadx_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://threadx:threadx_password@db:5432/threadx_db
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      MSG91_VERIFY_SSL: "false"
      RESEND_VERIFY_SSL: "false"
      ENVIRONMENT: development
      JWT_ALGORITHM: "HS256"
      JWT_SECRET_KEY: "dev-secret-change-in-production"
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ─── Next.js Frontend ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: threadx_frontend
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      BACKEND_ORIGIN: http://backend:8000
      ALLOWED_DEV_ORIGINS: https://*.trycloudflare.com
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
    command: npm run dev

volumes:
  postgres_data:
  redis_data: