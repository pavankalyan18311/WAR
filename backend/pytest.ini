[pytest]
testpaths = tests
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=80

markers =
    unit: Unit tests (no DB/external dependencies)
    integration: Integration tests (requires DB + Redis)
    e2e: End-to-end tests
